<!-- The mascot from the navbar, drawn static: same geometry and colours as
     Mascot.jsx, minus the eye tracking and the pulsing antenna. Keep the two in
     sync if the mascot changes shape.

     The viewBox is cropped tighter than the component's 0 0 48 48 so the robot
     fills a 16px tab icon instead of floating in its own margin, and the cream
     panel behind it keeps the dark outline readable on a dark tab strip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 44 44" fill="none">
  <rect x="2" y="0" width="44" height="44" fill="#F5F2F0" />

  <!-- antenna -->
  <path d="M24 10V5" stroke="#201E1D" stroke-width="2.5" stroke-linecap="square" />
  <circle cx="24" cy="3.5" r="2.5" fill="#EC3013" />

  <!-- screen head -->
  <rect
    x="6.25"
    y="10.25"
    width="35.5"
    height="27.5"
    fill="#EC3013"
    stroke="#201E1D"
    stroke-width="2.5"
  />

  <!-- eyes, resting at centre -->
  <circle cx="17.5" cy="23" r="6" fill="#F5F2F0" stroke="#201E1D" stroke-width="2" />
  <circle cx="17.5" cy="23" r="2.6" fill="#201E1D" />
  <circle cx="30.5" cy="23" r="6" fill="#F5F2F0" stroke="#201E1D" stroke-width="2" />
  <circle cx="30.5" cy="23" r="2.6" fill="#201E1D" />

  <!-- mouth -->
  <path d="M18 32.5H30" stroke="#201E1D" stroke-width="2.5" stroke-linecap="square" />

  <!-- feet -->
  <path d="M13 38V42M35 38V42" stroke="#201E1D" stroke-width="2.5" stroke-linecap="square" />
</svg>
